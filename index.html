<!doctype html>
<html lang="en" class="intro-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#343236" />
    <title>Haikal — Portfolio 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="intro" aria-hidden="true">
      <video class="intro__video" autoplay muted playsinline preload="auto">
        <source src="public/assets/intro/logo%20motion%20haikal.mp4" type="video/mp4" />
      </video>
    </div>
    <main>
      <section class="hero" aria-label="Haikal portfolio introduction">
        <header class="hero-header">
          <a class="hero-header__name" href="#top">HAIKAL PRAMMANA</a>
          <nav class="hero-header__nav" aria-label="Portfolio categories">
            <a href="#branding">BRANDING</a>
            <span aria-hidden="true">|</span>
            <a href="#illustration">ILLUSTRATION</a>
            <span aria-hidden="true">|</span>
            <a href="#graphic-design">GRAPHIC DESIGN</a>
          </nav>
        </header>
        <img class="hero__background" src="public/assets/hero/hero-background.png" alt="" />
        <img class="hero__overlay" src="public/assets/hero/hero-overlay.png" alt="" />

        <div class="hero__artboard" aria-hidden="true">
          <img class="hero__badge" src="public/assets/hero/hero-badge.png" alt="" />
          <img class="hero__wordmark" src="public/assets/hero/Text-Portfolio.png" alt="Portfolio" />
        </div>

        <div class="hero__meta">
          <a class="hero-label hero-label--branding" href="#branding">
            <span>(01)</span><strong>Branding</strong>
          </a>
          <a class="hero-label hero-label--graphic" href="#graphic-design">
            <span>(03)</span><strong>Graphic Design</strong>
          </a>
          <a class="hero-label hero-label--illustration" href="#illustration">
            <strong>Illustration</strong><span>(02)</span>
          </a>
          <p class="hero-year">2026</p>
        </div>
      </section>

      <section class="about" id="about" aria-label="About Akhmad Haikal Prammana">
        <img class="about__background" src="public/assets/about/background-page-2.png" alt="" loading="lazy" />
        <div class="about__artboard">
          <img class="about__layer about__photo" src="public/assets/about/Foto-Profile.png" alt="Akhmad Haikal Prammana standing outdoors" loading="lazy" />
          <img class="about__layer about__name" src="public/assets/about/Nama-Profile.png" alt="Bonjour, my name is Akhmad Haikal Prammana" loading="lazy" />
          <img class="about__layer about__education" src="public/assets/about/Kampus-jurusan.png" alt="Telkom University, 2022–2026, Desain Komunikasi Visual" loading="lazy" />
          <img class="about__layer about__description" src="public/assets/about/Deskripsi-Profile.png" alt="Freelance graphic designer profile" loading="lazy" />
          <img class="about__layer about__contact" src="public/assets/about/Contact-profile.png" alt="Contact information" loading="lazy" />
          <img class="about__layer about__apps" src="public/assets/about/App-Profile.png" alt="Adobe Illustrator, Adobe InDesign, Adobe Photoshop, Affinity Designer, and Procreate" loading="lazy" />
          <img class="about__layer about__logo" src="public/assets/about/Logo-profile.png" alt="Haikal Prammana monogram" loading="lazy" />
          <div class="about__photo-hitbox" aria-hidden="true"></div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
